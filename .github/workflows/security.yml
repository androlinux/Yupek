name: Security & Quality Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd yupek-backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        id: run_tests
        run: |
          cd yupek-backend
          export PYTHONPATH=.
          python -m unittest discover tests -v 2>&1 | tee test_results.log
        continue-on-error: true

      - name: Summarize Backend Results
        if: always()
        run: |
          if [ -f yupek-backend/test_results.log ]; then
            echo "### Backend Test Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 yupek-backend/test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if grep -q "FAILED" yupek-backend/test_results.log; then
              exit 1
            fi
          fi

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "yupek-web/package-lock.json"

      - name: Install dependencies
        run: |
          cd yupek-web
          npm ci

      - name: Run Next.js build
        id: run_build
        run: |
          cd yupek-web
          npm run build 2>&1 | tee build_results.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://umopnncjoswyilibslep.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_xGCmb036JS-dQiAi0KxWVw_LKUjQyfB"
          NEXT_PUBLIC_SITE_URL: "https://www.yupek.shop"
        continue-on-error: true

      - name: Summarize Frontend Results
        if: always()
        run: |
          if [ -f yupek-web/build_results.log ]; then
            echo "### Frontend Build Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 yupek-web/build_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if grep -q "Failed to compile" yupek-web/build_results.log; then
              exit 1
            fi
          fi
